[package]
name = "ikigai-inquiry"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Inquiries from public contact forms as ikigai resources: routed into layers by a classification funnel, with a layers client any host mounts."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-inquiry"
readme = "README.md"
keywords = ["ikigai", "roc", "contact", "spam", "module"]
categories = ["wasm", "text-processing"]

[dependencies]
# The released kernel, consumed from crates.io, so a host links exactly one `ikigai-core`.
# core 0.4.0 (scope opacity, structured denials; the cascade). ⚠ `"0.4.0"` is also a ceiling
# below 0.5.0.
ikigai-core = "0.4.0"
# `compose` and `each` fill the views, so visitor text reaches a page only through `$h{…}`;
# `html` is the escaping and link rules the views' Rust side shares with them.
ikigai-fn = "0.12.0"
# The actions and the holding stage are `Endpoint`s, whose `invoke` is `async_trait`.
async-trait = "0.1"
# The layers' JSON faces (listings, JSON-LD graphs) and `urn:llm:embed`'s answer are JSON, and a
# tuple is dropped as JSON-LD. ⚠ `"1"` is `<2.0.0`.
serde_json = "1"
# A confirmed example's embedding is base64 of little-endian f32s. 0.22.1 is the line the
# layer host links, so nothing new is compiled. ⚠ `"0.22.1"` is `<0.23.0`.
base64 = "0.22.1"
# The keyed hash behind sender keys and inquiry ids (its keyed mode, nothing else).
blake3 = "1"
# The RDF library that writes the edge's inquiry tuple: no Turtle is escaped by hand.
oxrdf = "0.3"
oxttl = "0.2"

# oxrdf draws on `rand` for blank-node ids; on wasm32-unknown-unknown its entropy comes from the
# JS host (ikigai-rdf does the same). This crate never mints a blank node.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
futures = "0.3"
# The tests run against a real layer host, opened on the shapes and context this crate ships,
# so what the edge, the client and the stage write, take and race on is what the layers
# actually admit.
ikigai-layers = "0.10.1"
# TEST-ONLY: ikigai-layers is still on core 0.3 and moves to 0.4.0 in wave 5 of the core 0.4.0
# cascade. Until then its space runs in a core 0.3 kernel of its own, bridged to the tests'
# core 0.4 kernel (`tests/bridge`). Drop this alias, and the bridge, in wave 5.
ikigai-core-03 = { package = "ikigai-core", version = "0.3.0" }
# The bridge carries requests across by their serde wire form. ⚠ `"1"` is `<2.0.0`.
serde = "1"
age = { version = "0.11.1", default-features = false }
# The views are well-formed, so a test reads their structure as XML.
roxmltree = "0.20"
